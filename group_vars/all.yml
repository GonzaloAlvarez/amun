---
homebrew_packages:
  - coreutils
  - moreutils
  - git
  - tmux
  - vim
  - neovim
  - asdf
  - gnupg
  - pinentry-mac
  - tig
  - tio
  - dockutil

homebrew_cask_packages:
  - firefox
  - alfred
  - iterm2
  - caffeine
  - font-jetbrains-mono-nerd-font

linux_packages:
  - apt-transport-https
  - binutils
  - cron
  - curl
  - debconf-utils
  - debian-goodies
  - dnsutils
  - gnupg
  - git
  - hdparm
  - locales
  - lsb-release
  - lsof
  - rsyslog
  - rsync
  - screen
  - sudo
  - unzip
  - python3-pip
  - python3-setuptools
  - vim-nox
  - neovim
  - net-tools
  - kbd

arch_packages:
  - base-devel
  - curl
  - git
  - gnupg
  - vim
  - neovim
  - openssh
  - python
  - python-pip
  - rsync
  - sudo
  - unzip

neovim_min_version: "0.11.2"

# Omarchy's ISO manifest preinstalls a broad desktop app set; amun converges it
# to the apps we actually use. Removals are Omarchy-only (plain Arch never had
# them). Chromium deliberately stays: Omarchy's omarchy-launch-webapp falls back
# to it for every non-Chromium default browser, so the docs menu rows and the
# HEY/Zoom scheme handlers need it even with Firefox as the default.
omarchy_remove_packages:
  - libreoffice-fresh
  - kdenlive
  - obs-studio
  - localsend
  - xournalpp
  - moonlight-qt

omarchy_packages:
  - firefox

# Ubuntu: no snapd. Every snap, the daemon, its data, plus a negative apt pin
# so nothing brings it back (ubuntu-desktop only Recommends it; the archive's
# firefox/thunderbird/chromium debs are shims that Depend on it). Set false on
# a host that really needs a snap.
ubuntu_remove_snapd: true

# Firefox from the Mozilla Team PPA instead of the snap. 'auto' installs it on
# an Ubuntu Desktop (ubuntu-desktop-minimal) or wherever a firefox deb already
# is - the snap shim included; true/false force it either way.
ubuntu_firefox: auto

# Termux (Android). Not linux_packages: cron/rsyslog/sudo/locales/kbd have no
# place in a Termux prefix. jq is required by the seshat-installed
# ~/.claude/statusline.sh and amun is the only package provisioner here.
termux_packages:
  - curl
  - git
  - gnupg
  - jq
  # ncurses-utils provides tput, used by the dotfiles bashrc (LESS_TERMCAP)
  - ncurses-utils
  - neovim
  - openssh
  - procps
  - python
  - python-cryptography
  - python-ensurepip-wheels
  - python-pip
  - rsync
  - tmux
  - unzip
  - vim

termux_ssh_port: "8022"
amun_termux_start_sshd: true
# amun-termux overrides this with -e amun_termux_prefix=$PREFIX.
amun_termux_prefix: "{{ ansible_facts['env']['PREFIX'] | default('/data/data/com.termux/files/usr') }}"
