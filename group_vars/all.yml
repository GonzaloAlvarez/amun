---
homebrew_packages:
  - coreutils
  - moreutils
  - git
  - tmux
  - vim
  - neovim
  - asdf
  - gnupg
  - pinentry-mac
  - tig
  - tio
  - dockutil

homebrew_cask_packages:
  - firefox
  - alfred
  - iterm2
  - caffeine
  - font-jetbrains-mono-nerd-font

linux_packages:
  - apt-transport-https
  - binutils
  - cron
  - curl
  - debconf-utils
  - debian-goodies
  - dnsutils
  - gnupg
  - git
  - hdparm
  - locales
  - lsb-release
  - lsof
  - rsyslog
  - rsync
  - screen
  - sudo
  - unzip
  - python3-pip
  - python3-setuptools
  - vim-nox
  - neovim
  - net-tools
  - kbd

arch_packages:
  - base-devel
  - curl
  - git
  - gnupg
  - vim
  - neovim
  - openssh
  - python
  - python-pip
  - rsync
  - sudo
  - unzip

neovim_min_version: "0.11.2"

# Termux (Android). Not linux_packages: cron/rsyslog/sudo/locales/kbd have no
# place in a Termux prefix. jq is required by the seshat-installed
# ~/.claude/statusline.sh and amun is the only package provisioner here.
termux_packages:
  - curl
  - git
  - gnupg
  - jq
  # ncurses-utils provides tput, used by the dotfiles bashrc (LESS_TERMCAP)
  - ncurses-utils
  - neovim
  - openssh
  - procps
  - python
  - python-cryptography
  - python-ensurepip-wheels
  - python-pip
  - rsync
  - tmux
  - unzip
  - vim

termux_ssh_port: "8022"
amun_termux_start_sshd: true
# amun-termux overrides this with -e amun_termux_prefix=$PREFIX.
amun_termux_prefix: "{{ ansible_env.PREFIX | default('/data/data/com.termux/files/usr') }}"
