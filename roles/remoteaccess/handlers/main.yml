---
- name: Restart sshd
  service:
    name: "{{ sshd_service_name }}"
    state: restarted
  become: true

# -f '(^|/)sshd$' kills only the listener (full-path process names on real
# Android; OpenSSH 10 sshd-session processes — live connections — survive).
- name: Restart sshd (Termux)
  ansible.builtin.shell: |
    pkill -f '(^|/)sshd$' || true
    {{ amun_termux_prefix }}/bin/sshd
  when: amun_termux_start_sshd | default(true) | bool
