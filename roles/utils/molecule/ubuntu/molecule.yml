---
# Ubuntu scenario: snapd purge + Firefox from the Mozilla Team PPA. A container
# can hold the snapd deb but never run a snap, so the snap-removal loop is
# exercised on its "nothing to remove" path here and for real in `./test ubuntu`.
driver:
  name: docker
platforms:
  - name: utils-ubuntu
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
