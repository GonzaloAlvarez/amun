---
# amun_is_termux is set by main.yml's pre_tasks; molecule and ./deploy run
# roles without those pre_tasks, so every in-role reference defaults false.
- name: Configure Termux utilities
  import_tasks: termux.yml
  when: amun_is_termux | default(false)

- name: Configure standard macOS/Linux utilities
  import_tasks: standard.yml
  when: not (amun_is_termux | default(false))

- name: Install amun CLI
  import_tasks: all_amun.yml
