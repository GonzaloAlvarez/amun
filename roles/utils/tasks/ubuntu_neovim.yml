---
# apt refuses to read ANY sources when the same PPA is defined twice with
# different Signed-By values ("Conflicting values set for option Signed-By").
# Older ansible-core apt_repository wrote a one-line .list (empty Signed-By);
# current versions and add-apt-repository write deb822 .sources with the key
# inline. Drop every neovim-ppa source that is not the file we manage, and do
# it BEFORE any apt task — a broken source list makes every apt call fail.
- name: Find conflicting neovim PPA source files
  shell: "grep -l 'ppa.launchpadcontent.net/neovim-ppa' /etc/apt/sources.list.d/* 2>/dev/null | grep -v '^/etc/apt/sources.list.d/neovim-ppa.sources$' || true"
  register: neovim_ppa_stale_sources
  changed_when: false

- name: Remove conflicting neovim PPA source files
  file:
    path: "{{ item }}"
    state: absent
  become: true
  loop: "{{ neovim_ppa_stale_sources.stdout_lines }}"

- name: Find stale neovim PPA keys in the global trusted keyring dir
  find:
    paths: /etc/apt/trusted.gpg.d
    patterns: "*neovim*"
  register: neovim_ppa_stale_keys

- name: Remove stale neovim PPA keys from the global trusted keyring dir
  file:
    path: "{{ item.path }}"
    state: absent
  become: true
  loop: "{{ neovim_ppa_stale_keys.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install python3-debian for deb822 repository management
  apt:
    name: python3-debian
    state: present
    update_cache: yes
  become: true

- name: Add neovim unstable PPA
  ansible.builtin.deb822_repository:
    name: neovim-ppa
    types: deb
    uris: https://ppa.launchpadcontent.net/neovim-ppa/unstable/ubuntu/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "{{ lookup('ansible.builtin.file', 'neovim-ppa-unstable.asc') }}"
  become: true

- name: Install neovim from PPA
  apt:
    name: neovim
    state: latest
    update_cache: yes
  become: true
